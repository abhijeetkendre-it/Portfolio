<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent | Abhijeet Kendre</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                        poppins: ['"Poppins"', 'sans-serif'],
                    },
                    colors: {
                        dark: '#0a0a0a',
                        accent: '#3b82f6',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            overflow-x: hidden;
        }
        
        .bg-animated {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.12), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(147, 51, 234, 0.12), transparent 25%);
            animation: backgroundShift 15s ease-in-out infinite alternate;
        }

        @keyframes backgroundShift {
            0% { transform: scale(1); }
            50% { transform: scale(1.1) translate(2%, 2%); }
            100% { transform: scale(1) translate(-2%, -2%); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
        }
        
        .text-gradient {
            background: linear-gradient(to right, #3b82f6, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .success-checkmark {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(34, 197, 94, 0.1);
            border: 2px solid rgba(34, 197, 94, 0.5);
            animation: scaleIn 0.5s ease-out forwards;
        }
        
        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="antialiased selection:bg-accent selection:text-white flex flex-col items-center justify-center min-h-screen relative">

    <div class="bg-animated"></div>

    <nav class="fixed w-full z-50 top-0 transition-all duration-300 backdrop-blur-md border-b border-white/5 bg-black/50">
        <div class="max-w-6xl mx-auto px-6 py-5 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold tracking-tighter">A <span class="text-accent">K</span></a>
        </div>
    </nav>

    <main class="max-w-lg w-full px-6 mt-20 z-10">
        <div class="glass-card p-10 text-center relative overflow-hidden shadow-2xl">
            <!-- Decorative blur -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-green-500/20 rounded-full blur-2xl"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-blue-500/20 rounded-full blur-2xl"></div>
            
            <div class="relative z-10">
                <div class="success-checkmark mb-6">
                    <i class="fa-solid fa-check text-4xl text-green-500"></i>
                </div>
                
                <h1 class="text-3xl font-bold mb-4">Message Sent<span class="text-accent">!</span></h1>
                <p class="text-gray-400 mb-8">Thank you for reaching out. I have received your message and will get back to you as soon as possible.</p>
                
                <a href="index.html" class="inline-flex items-center justify-center gap-2 px-8 py-3 bg-gradient-to-r from-blue-500 to-purple-600 text-white font-semibold rounded-lg hover:from-blue-600 hover:to-purple-700 transition-all transform hover:-translate-y-1 shadow-[0_5px_15px_rgba(59,130,246,0.4)]">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back to Portfolio</span>
                </a>
            </div>
        </div>
    </main>

    <footer class="absolute bottom-6 w-full text-center z-10">
        <p class="text-sm text-gray-500">&copy; 2026 Abhijeet Kendre. All rights reserved.</p>
    </footer>

</body>
</html>
